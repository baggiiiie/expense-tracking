name: Resolve Issue

on:
  # Auto-resolve issues opened (or reopened) by the repo owner.
  issues:
    types: [opened, reopened]
  # Manual run against a specific issue.
  workflow_dispatch:
    inputs:
      issueNumber:
        description: "Issue number to resolve"
        required: true
        type: string

jobs:
  deployment-ready:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.issue.user.login == 'baggiiiie' }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require release credential before attempting a fix
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN first; refusing to close issues with undeployable fixes. See worker/README.md.'
            exit 1
          fi

  resolve-issue:
    needs: deployment-ready
    # Auto-run only for issues authored by baggiiiie; manual dispatch always runs.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.issue.user.login == 'baggiiiie' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      applied: ${{ steps.resolve.outputs.applied }}
    permissions:
      contents: write # commit and push the fix to the default branch
      issues: write # comment and close
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: npm ci
      - name: Install resolver sandbox
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap
      - name: Resolve issue
        id: resolve
        env:
          # The workflow keeps this out of the coding agent's environment.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # bedrock-mantle provider (Anthropic Messages protocol).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ISSUE="${{ github.event_name == 'workflow_dispatch' && inputs.issueNumber || github.event.issue.number }}"
          npm run resolve-issue -- --issue "${ISSUE}"

  deploy:
    needs: resolve-issue
    if: ${{ needs.resolve-issue.outputs.applied == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-worker.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
