name: Resolve Issue

on:
  # Auto-resolve issues opened (or reopened) by the repo owner.
  issues:
    types: [opened, reopened]
  # Manual run against a specific issue.
  workflow_dispatch:
    inputs:
      issueNumber:
        description: "Issue number to resolve"
        required: true
        type: string
      dryRun:
        description: "Triage and plan only (no edits, PR, or close)"
        required: false
        type: boolean
        default: true

jobs:
  resolve-issue:
    # Auto-run only for issues authored by baggiiiie; manual dispatch always runs.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.issue.user.login == 'baggiiiie' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write  # commit and push the fix to the default branch
      issues: write    # comment and close
      actions: write   # dispatch the server image workflow after bot commits
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: npm ci
      - name: Set up agent-browser (visual verification)
        # agent-browser drives its own headless Chrome and records WebM through
        # CDP. Visible web fixes require a screenshot and recording; a failure
        # leaves the issue open. Install ffmpeg explicitly rather than relying
        # on the hosted runner image because it converts WebM to GIF/MP4.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          npx --no-install agent-browser install --with-deps
          ffmpeg -version
          npx --no-install agent-browser doctor --offline
      - name: Resolve issue
        env:
          # gh/git auth for the agent's tools.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # bedrock-mantle provider (Anthropic Messages protocol).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Ubuntu 24.04 hosted runners block Chromium's user-namespace sandbox
          # with AppArmor. This job is ephemeral and only records the local,
          # throwaway demo server, so disable Chromium's sandbox for this step.
          AGENT_BROWSER_ARGS: --no-sandbox
        run: |
          ISSUE="${{ github.event_name == 'workflow_dispatch' && inputs.issueNumber || github.event.issue.number }}"
          DRY="${{ github.event_name == 'workflow_dispatch' && inputs.dryRun || 'false' }}"
          npx flue run resolve-issue --target node \
            --payload "{\"issueNumber\": ${ISSUE}, \"dryRun\": ${DRY}}"

      - name: Upload visual verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-${{ github.event.issue.number || inputs.issueNumber }}-visual-proof
          path: |
            /tmp/demo.webm
            /tmp/issue-*.png
            /tmp/issue-*.gif
            /tmp/issue-*.mp4
          if-no-files-found: ignore
          retention-days: 14

      - name: Dispatch server image build
        if: ${{ success() && !(github.event_name == 'workflow_dispatch' && inputs.dryRun) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin master
          HEAD_SHA="$(git rev-parse origin/master)"
          echo "Dispatching Server Image for master at ${HEAD_SHA}"
          gh workflow run server-image.yml --ref master
